$kind: http-request
description: Envía un email con formato inválido; el schema de Marshmallow debe rechazarlo con 400.
url: "{{base_url}}/blacklists"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{bearer_token}}
body:
  type: text
  content: |-
    {
        "email": "esto-no-es-un-email",
        "app_uuid": "{{test_app_uuid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400 por email inválido', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 7000
