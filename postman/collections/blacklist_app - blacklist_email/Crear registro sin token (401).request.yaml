$kind: http-request
description: Intenta crear un registro sin el header Authorization; debe responder 401.
url: "{{base_url}}/blacklists"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "sin.token@example.com",
        "app_uuid": "{{test_app_uuid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 401 sin Authorization', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 6000
